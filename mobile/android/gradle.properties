org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler computes a relative path between the pub
# cache (C:\...) and this project (D:\...) to key its caches - on Windows,
# relativizing across different drive letters throws
# "this and base files have different roots" and fails the build (first
# hit by android_file_picker, the first plugin here with Kotlin sources).
# Disabling incremental compilation avoids that relative-path computation
# entirely; the tradeoff is a full recompile every time instead of an
# incremental one.
kotlin.incremental=false
