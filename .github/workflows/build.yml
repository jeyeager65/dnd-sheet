name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

defaults:
  run:
    working-directory: mobile

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      # The version lives in one place: pubspec.yaml's `version:` (x.y.z).
      # A tag build must be tagged v<that version>; any other build is
      # labeled with the run number too, so every file name is unique.
      - id: v
        shell: bash
        run: |
          version=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::No x.y.z version found in mobile/pubspec.yaml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag doesn't match pubspec.yaml version $version"
              exit 1
            fi
            label="$version"
          else
            label="$version-build.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Version $version, files labeled $label"

  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (arm64-v8a)
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      APK: dnd-sheet-${{ needs.version.outputs.label }}-android-arm64.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Only the 64-bit ARM APK - nearly every current Android device. The
      # run number is the Android versionCode, so each build installs over
      # the last.
      - run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --build-name ${{ needs.version.outputs.version }}
          --build-number ${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: mobile/${{ env.APK }}
          if-no-files-found: error

  windows:
    name: Windows
    needs: [version, test]
    runs-on: windows-latest
    env:
      ZIP: dnd-sheet-${{ needs.version.outputs.label }}-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name ${{ needs.version.outputs.version }}
          --build-number ${{ github.run_number }}
      # The whole Release folder is the app (exe, DLLs, data/).
      - name: Zip the Release folder
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $env:ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: mobile/${{ env.ZIP }}
          if-no-files-found: error

  release:
    name: GitHub Release
    # Only for a pushed version tag (v1.0.0, ...).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/*.zip
          generate_release_notes: true
